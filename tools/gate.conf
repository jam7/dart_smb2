# What the commit gate measures in this project. Sourced by the hooks in
# .githooks/, which come from https://github.com/jam7/ai-dev-gates
#
# This file is yours: install.sh (in that repository) creates it when it is
# missing and never replaces it, so updating the hooks cannot reset what you
# configured here. Shell syntax, since the hooks source it -- assignments
# only, no commands.

# Extensions the structure check measures, comma separated.
ext=".dart"

# Directories it measures, space separated. Production code only: test/
# fixtures would drown the signal.
scope="lib"

# Anything else to run before a commit, as a shell command, from the
# repository root. It runs only when the commit touches a file matching ext.
extra_checks=""

# A document of this project's, shown as "see <doc>" when the private-data
# gate blocks a commit or a push. This repository has no such document yet;
# the vocabulary rationale lives in the app repository's docs/private-data.md.
private_doc=""

# What the old local checker scanned: every dart/md/yaml/sh/txt file, and the
# denylist from the app repository's private notes when nested inside its
# working tree. The allow file (tools/private-allow.txt) holds the policy the
# old checker kept as constants.
private_args="--denylist ../notes/private-patterns.txt --scan-scope \.(dart|md|ya?ml|sh|txt)$"

# Prose for textlint (tools/check-text.py). Empty leaves the text gate off.
#
# The rules are preset-ja-technical-writing, so only Japanese documents are
# in scope: README.md and docs/protocol_status.md are written in English for
# whoever picks the library up, and a 120-character sentence limit meant for
# Japanese flags ordinary English prose (measured 2026-08-16: 27 of this
# repository's 31 findings were that, and none of them were writing faults).
text_scope="^(?!README\.md$|docs/protocol_status\.md$).*\.md$"
